[project]
name = "profiler"
version = "0.1.0"
description = "Narzędzie do profilowania kodu"
readme = "README.md"
authors = [
    { name = "Olaf Skrzypiec", email = "olafskrzypiec@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
